[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tick-bench"
version = "0.1.0"
description = "High-throughput tick data processing benchmark across Polars, DuckDB, and Apache Arrow."
authors = [{ name = "Seyed Mehrdad Dastouri" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyarrow>=14.0.0",
    "polars>=0.20.0",
    "duckdb>=0.10.0",
    "numpy>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
